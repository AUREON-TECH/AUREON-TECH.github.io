name: Fix AUREON SW Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sw-version.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align service-worker registration with cache version
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = "./sw.js?v=3-private-vary-range-safe-shell"
          new = "./sw.js?v=v4-private-vary-range-safe-shell"
          if old not in text:
              raise SystemExit('expected v3 service-worker registration not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(pwa): align AUREON service worker registration with v4'
          git push
