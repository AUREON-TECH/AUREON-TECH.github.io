name: founder-home-test

on:
  push:
    branches:
      - feature/founder-home-v2
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run founder home acceptance test
        run: node tests/founder-home.test.js
