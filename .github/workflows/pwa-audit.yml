name: AUREON PWA Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA contract
        run: |
          set -euo pipefail
          test -f manifest.webmanifest
          test -f sw.js
          test -f index.html
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-512.png
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          for (const key of ['name','short_name','start_url','display','theme_color','icons']) {
            if (!manifest[key]) throw new Error(`manifest missing ${key}`);
          }
          if (manifest.display !== 'standalone') throw new Error('display must be standalone');
          const icons = manifest.icons || [];
          if (!icons.some(i => i.sizes === '192x192')) throw new Error('missing 192x192 icon');
          if (!icons.some(i => i.sizes === '512x512')) throw new Error('missing 512x512 icon');
          if (!icons.some(i => String(i.purpose || '').includes('maskable'))) throw new Error('missing maskable icon');

          const sw = fs.readFileSync('sw.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const cacheMatch = sw.match(/CACHE_NAME=`\$\{CACHE_PREFIX\}([^`]+)`/);
          if (!cacheMatch) throw new Error('unable to read service-worker cache version');
          const version = cacheMatch[1];
          if (!html.includes(`sw.js?v=${version}`)) throw new Error(`service-worker registration is not aligned with ${version}`);
          for (const required of ['authorization','cookie','range','if-range','private','no-store','set-cookie','content-range']) {
            if (!sw.toLowerCase().includes(required)) throw new Error(`service worker missing cache-safety guard: ${required}`);
          }
          if (!html.includes("updateViaCache: 'none'")) throw new Error('service-worker registration must bypass HTTP cache');
          if (!html.includes("location.protocol === 'https:'")) throw new Error('service worker must be restricted to HTTPS/localhost');
          NODE
