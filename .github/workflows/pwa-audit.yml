name: AUREON Diagnostic Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run diagnostic test suite
        run: node --test tests/*.test.js
      - name: Validate PWA contract
        run: |
          set -euo pipefail
          test -f manifest.webmanifest
          test -f sw.js
          test -f index.html
          test -f js/app.js
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-512.png
          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          for (const key of ['name','short_name','start_url','scope','display','theme_color','background_color','icons']) {
            if (!manifest[key]) throw new Error(`manifest missing ${key}`);
          }
          if (manifest.display !== 'standalone') throw new Error('display must be standalone');
          if (manifest.start_url !== './' || manifest.scope !== './') throw new Error('PWA start_url/scope must remain relative to GitHub Pages root');

          const icons = manifest.icons || [];
          if (!icons.some(i => i.sizes === '192x192')) throw new Error('missing 192x192 icon');
          if (!icons.some(i => i.sizes === '512x512')) throw new Error('missing 512x512 icon');
          if (!icons.some(i => String(i.purpose || '').includes('maskable'))) throw new Error('missing maskable icon');

          const sw = fs.readFileSync('sw.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');

          for (const asset of ['./index.html','./css/diagnostico.css','./js/site-config.js','./js/questions.js','./js/engine.js','./js/state.js','./js/whatsapp.js','./js/app.js','./terms.html','./privacy.html','./manifest.webmanifest']) {
            if (!sw.includes(asset)) throw new Error(`service worker missing ${asset}`);
          }
          if (!/const CACHE\s*=\s*["']aureon-diagnostico-v\d+["']/.test(sw)) throw new Error('service-worker cache is not versioned');
          if (!html.includes('viewport-fit=cover')) throw new Error('viewport-fit=cover missing');
          if (!html.includes('./manifest.webmanifest')) throw new Error('manifest link missing');
          if (!/navigator\.serviceWorker\.register\(["']\.\/sw\.js(?:\?v=[^"']+)?["']/.test(app)) throw new Error('service worker registration missing');
          if (!/updateViaCache:\s*["']none["']/.test(app)) throw new Error('service worker must bypass HTTP cache on update');
          NODE
