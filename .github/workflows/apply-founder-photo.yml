name: apply-founder-photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-founder-photo.yml'
      - 'assets/raphael-founder.jpg'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply founder photo to hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.hero-card{position:relative;min-height:470px;border:1px solid var(--line);border-radius:32px;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(217,183,104,.2),transparent 28%),linear-gradient(160deg,#151820,#0a0c10 66%);box-shadow:0 30px 80px rgba(0,0,0,.36)}'
          new='.hero-card{position:relative;min-height:470px;border:1px solid var(--line);border-radius:32px;overflow:hidden;background:linear-gradient(to top,rgba(4,5,7,.32),rgba(4,5,7,.03) 60%),url(./assets/raphael-founder.jpg) center 26%/cover no-repeat;box-shadow:0 30px 80px rgba(0,0,0,.36)}'
          if old not in s:
              raise SystemExit('hero-card signature not found')
          s=s.replace(old,new,1)
          s=s.replace('          <span class="photo-note">foto do fundador pronta para entrar aqui</span>\n','',1)
          p.write_text(s)

          sw=Path('sw.js')
          w=sw.read_text().replace("v5-founder-home","v6-founder-photo",1)
          w=w.replace("'./icon.svg'","'./icon.svg','./assets/raphael-founder.jpg'",1)
          sw.write_text(w)
          PY
      - name: Commit photo integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'feat: show founder photo in hero'
          git push
