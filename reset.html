<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06142d">
<title>Atualizando AUREON</title>
<style>
  :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06142d;color:#fff}
  main{width:min(520px,calc(100% - 40px));text-align:center}
  .mark{width:72px;height:72px;margin:0 auto 24px;border:1px solid #6ea8ff;border-radius:22px;display:grid;place-items:center;font-size:32px;font-weight:800}
  h1{font-size:28px;margin:0 0 12px}
  p{color:#b9c8e5;line-height:1.6;margin:0}
</style>
</head>
<body>
<main>
  <div class="mark">A</div>
  <h1>Atualizando a AUREON…</h1>
  <p>Removendo a versão antiga e abrindo a versão mais recente.</p>
</main>
<script>
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter((key) => key.startsWith("aureon-")).map((key) => caches.delete(key)));
    }
    localStorage.removeItem("aureon.diagnostic.v1");
    sessionStorage.clear();
  } finally {
    location.replace("./?fresh=20260921-7");
  }
})();
</script>
</body>
</html>
