<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="AUREON — apps, automações, micro SaaS e inteligência artificial.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>AUREON | Links</title>
  <style>
    :root{--bg:#05070d;--text:#f7f9fc;--muted:#91a0b5;--line:rgba(255,255,255,.10);--gold:#f3c860;--cyan:#22d3ee;--violet:#8b5cf6}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;color:var(--text);background:radial-gradient(circle at 18% -8%,rgba(139,92,246,.22),transparent 35%),radial-gradient(circle at 100% 2%,rgba(34,211,238,.13),transparent 30%),radial-gradient(circle at 50% 110%,rgba(243,200,96,.08),transparent 35%),var(--bg);display:flex;justify-content:center}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(620px,100%);padding:44px 18px 56px;position:relative;z-index:1}
    .profile{text-align:center;margin-bottom:28px}
    .logo{width:92px;height:92px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;font-size:46px;font-weight:950;color:#111827;background:linear-gradient(145deg,#f6d574,#f2be46);box-shadow:0 22px 70px rgba(243,200,96,.16),inset 0 1px 0 rgba(255,255,255,.75);position:relative}
    .logo:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(243,200,96,.18);border-radius:36px}
    .brand{font-size:34px;font-weight:900;letter-spacing:-.04em;margin:0}
    .handle{margin-top:6px;font-size:13px;color:#b9c3d2;letter-spacing:.08em}
    .bio{max-width:500px;margin:14px auto 0;font-size:15px;line-height:1.6;color:var(--muted)}
    .bio strong{color:#eef2f7}
    .links{display:grid;gap:12px;margin-top:30px}
    .link{min-height:68px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));display:flex;align-items:center;padding:14px 16px;gap:14px;transition:.2s ease;box-shadow:0 12px 35px rgba(0,0,0,.15)}
    .link:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.035))}
    .icon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}
    .icon svg{width:21px;height:21px}
    .copy{flex:1;min-width:0}.copy b{display:block;font-size:15px}.copy small{display:block;margin-top:4px;font-size:12px;color:#8e9aaf}
    .arrow{font-size:22px;opacity:.58}
    .social-row{display:flex;justify-content:center;gap:12px;margin-top:26px}
    .social-row a{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s ease}
    .social-row a:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
    .social-row svg{width:20px;height:20px}
    footer{text-align:center;margin-top:34px;font-size:11px;line-height:1.7;color:#66748a}
    footer b{color:#aeb8c8;letter-spacing:.12em}
    @media(max-width:520px){.wrap{padding-top:32px}.brand{font-size:30px}.bio{font-size:14px}.link{min-height:64px}}
  </style>
</head>
